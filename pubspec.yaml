name: outfity
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  get_it: ^9.3.0

  # State management
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0

  # Navigation
  go_router:

  # Camera & images
  camera:
  image_picker:
  flutter_image_compress:

  # Local files
  path_provider: ^2.1.6
  path: ^1.9.1

  # Local database
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs:

  # IDs
  uuid:
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner:
  freezed: ^4.0.2
  drift_dev:
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#6750A4"
  adaptive_icon_foreground: "assets/icons/app_icon.png"